<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo da Velha</title>
<style>
:root {
  --bg: #f3f5f7; --surface: #ffffff; --text: #1f2933; --muted: #667085;
  --line: #d0d5dd; --x: #2563eb; --o: #e11d48; --win: #dcfce7;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181d; --surface: #1e242b; --text: #e8ecf0; --muted: #9aa5b1;
    --line: #38424d; --x: #6ea0ff; --o: #ff6b8a; --win: #1f4d36; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181d; --surface: #1e242b; --text: #e8ecf0; --muted: #9aa5b1;
  --line: #38424d; --x: #6ea0ff; --o: #ff6b8a; --win: #1f4d36; color-scheme: dark;
}
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 24px 16px; gap: 20px;
}
h1 { margin: 0; font-size: 1.6rem; }
.placar { display: flex; gap: 12px; width: 100%; max-width: 360px; }
.jogador {
  flex: 1; background: var(--surface); border: 2px solid var(--line);
  border-radius: 10px; padding: 10px; text-align: center;
}
.jogador.ativo { border-color: currentColor; }
.jogador.x { color: var(--x); } .jogador.o { color: var(--o); }
.jogador .nome { font-size: .9rem; color: var(--muted); }
.jogador .pontos { font-size: 2rem; font-weight: 700; }
.empates { color: var(--muted); font-size: .95rem; }
#status { font-size: 1.1rem; min-height: 1.4em; font-weight: 600; }
.tabuleiro {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  width: 100%; max-width: 360px;
}
.casa {
  aspect-ratio: 1; font-size: 3rem; font-weight: 700; cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); border-radius: 10px;
  color: var(--text); font-family: inherit;
}
.casa:focus-visible { outline: 3px solid var(--x); outline-offset: 2px; }
.casa.x { color: var(--x); } .casa.o { color: var(--o); }
.casa.vitoria { background: var(--win); }
.casa:disabled { cursor: default; }
.botoes { display: flex; gap: 10px; }
.botoes button {
  padding: 10px 16px; border-radius: 8px; border: 2px solid var(--line);
  background: var(--surface); color: var(--text); font: inherit; cursor: pointer;
}
</style>
</head>
<body>
<h1>Jogo da Velha</h1>

<div class="placar">
  <div class="jogador x" id="card-X"><div class="nome">Jogador 1 (X)</div><div class="pontos" id="pontos-X">0</div></div>
  <div class="jogador o" id="card-O"><div class="nome">Jogador 2 (O)</div><div class="pontos" id="pontos-O">0</div></div>
</div>
<div class="empates">Empates: <span id="pontos-E">0</span></div>

<div id="status"></div>
<div class="tabuleiro" id="tabuleiro"></div>

<div class="botoes">
  <button id="novo">Nova partida</button>
  <button id="zerar">Zerar placar</button>
</div>

<script>
const combos = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const placar = { X: 0, O: 0, E: 0 };
let tab, vez, fim, inicial = 'X';
const el = document.getElementById('tabuleiro');
const status = document.getElementById('status');
const casas = [];

for (let i = 0; i < 9; i++) {
  const b = document.createElement('button');
  b.className = 'casa';
  b.setAttribute('aria-label', 'Casa ' + (i + 1));
  b.addEventListener('click', () => jogar(i));
  el.appendChild(b);
  casas.push(b);
}

function iniciar() {
  tab = Array(9).fill(null);
  vez = inicial;
  fim = false;
  casas.forEach(c => { c.textContent = ''; c.className = 'casa'; c.disabled = false; });
  atualizar();
}

function atualizar() {
  ['X', 'O'].forEach(j => {
    document.getElementById('pontos-' + j).textContent = placar[j];
    document.getElementById('card-' + j).classList.toggle('ativo', !fim && vez === j);
  });
  document.getElementById('pontos-E').textContent = placar.E;
}

function jogar(i) {
  if (fim || tab[i]) return;
  tab[i] = vez;
  casas[i].textContent = vez;
  casas[i].classList.add(vez.toLowerCase());
  casas[i].disabled = true;

  const combo = combos.find(c => c.every(k => tab[k] === vez));
  if (combo) {
    fim = true;
    placar[vez]++;
    combo.forEach(k => casas[k].classList.add('vitoria'));
    status.textContent = 'Jogador ' + (vez === 'X' ? '1 (X)' : '2 (O)') + ' venceu!';
  } else if (tab.every(Boolean)) {
    fim = true;
    placar.E++;
    status.textContent = 'Empate!';
  } else {
    vez = vez === 'X' ? 'O' : 'X';
    status.textContent = 'Vez do jogador ' + (vez === 'X' ? '1 (X)' : '2 (O)');
  }
  if (fim) casas.forEach(c => c.disabled = true);
  atualizar();
}

document.getElementById('novo').addEventListener('click', () => {
  inicial = inicial === 'X' ? 'O' : 'X';
  iniciar();
  status.textContent = 'Vez do jogador ' + (vez === 'X' ? '1 (X)' : '2 (O)');
});
document.getElementById('zerar').addEventListener('click', () => {
  placar.X = placar.O = placar.E = 0;
  inicial = 'X';
  iniciar();
  status.textContent = 'Vez do jogador 1 (X)';
});

iniciar();
status.textContent = 'Vez do jogador 1 (X)';
</script>
</body>
</html>
